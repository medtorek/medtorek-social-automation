name: PUBLICAR PRUEBA REAL AHORA (3 redes)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medtorek-publisher
  cancel-in-progress: false
jobs:
  publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CONFIRM_PUBLIC_TEST: PUBLISH_TEST_NOW
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Preparar registro de resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: PUBLICAR prueba real en X, LinkedIn e Instagram
        run: python publish_test_now.py
