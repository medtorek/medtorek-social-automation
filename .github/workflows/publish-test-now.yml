name: PRUEBA PUBLICA ahora (X LinkedIn Instagram)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir PUBLISH_TEST_NOW para publicar realmente en las 3 redes'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: medtorek-publisher
  cancel-in-progress: false
jobs:
  publish-test:
    if: ${{ inputs.confirm == 'PUBLISH_TEST_NOW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CONFIRM_PUBLIC_TEST: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Identidad para registrar resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publicar contenido de prueba (PUBLICO)
        run: python publish_test_now.py
