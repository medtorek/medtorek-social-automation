name: Crear borradores de prueba en Buffer (sin publicar)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medtorek-publisher
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Crear borradores, no publicar
        run: python publisher.py draft
      - name: Guardar comprobantes
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/
          if ! git diff --cached --quiet; then git commit -m 'Record Buffer draft validation'; git push; fi
