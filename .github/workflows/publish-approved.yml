name: Publicar articulo aprobado

on:
  workflow_dispatch:
    inputs:
      doi:
        description: "DOI exacto del articulo aprobado (sin URL)"
        required: true
        type: string
      approval:
        description: "Escribe PUBLICAR seguido de un espacio y el DOI exacto"
        required: true
        type: string
      preview_only:
        description: "Prueba segura sin publicar (desmarcar solo tras revisar)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: medtorek-publisher
  cancel-in-progress: false

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APPROVED_DOI: ${{ inputs.doi }}
      APPROVAL_CONFIRM: ${{ inputs.approval }}
      PREVIEW_ONLY: ${{ inputs.preview_only }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Set git identity for publication receipts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Validate approved material and optionally publish now
        run: python publish_approved.py
